<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labelme 标签显示方式演示</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --bg-secondary: #16213e;
    --bg-panel: #0f3460;
    --fg: #e8e8e8;
    --fg-muted: #8899aa;
    --accent: #e94560;
    --accent-hover: #ff6b81;
    --border: #1e3a5f;
    --card: #1a2744;
    --success: #00d2d3;
    --warning: #feca57;
    --info: #54a0ff;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    height: 100vh;
  }

  /* 顶部工具栏 */
  .toolbar {
    height: 48px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    z-index: 100;
  }

  .toolbar-title {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    margin-right: 24px;
    letter-spacing: 1px;
  }

  .toolbar-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .toolbar-btn:hover {
    background: var(--bg-panel);
    color: var(--fg);
    border-color: var(--accent);
  }

  .toolbar-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .toolbar-separator {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 8px;
  }

  .toolbar-slider-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .toolbar-slider-group label {
    font-size: 12px;
    color: var(--fg-muted);
    white-space: nowrap;
  }

  .toolbar-slider-group input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .toolbar-slider-group .slider-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    min-width: 32px;
  }

  /* 主区域 */
  .main-container {
    display: flex;
    height: calc(100vh - 48px);
  }

  /* 画布区域 */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(233,69,96,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(84,160,255,0.04) 0%, transparent 60%),
      var(--bg);
  }

  .canvas-area canvas {
    display: block;
    cursor: crosshair;
  }

  /* 画布上方的提示 */
  .canvas-hint {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 52, 96, 0.9);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--fg-muted);
    pointer-events: none;
    border: 1px solid var(--border);
    white-space: nowrap;
    transition: opacity 0.3s;
  }

  .canvas-hint i { color: var(--accent); margin-right: 4px; }

  /* 缩放指示 */
  .zoom-indicator {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(15, 52, 96, 0.85);
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--fg-muted);
    pointer-events: none;
  }

  /* 右侧面板 */
  .side-panel {
    width: 300px;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    border-bottom: 1px solid var(--border);
  }

  .panel-section-header {
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--fg-muted);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }

  .panel-section-header:hover { color: var(--fg); }

  .panel-section-header i {
    font-size: 10px;
    transition: transform 0.3s;
  }

  .panel-section-header.collapsed i { transform: rotate(-90deg); }

  .panel-section-body {
    max-height: 400px;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .panel-section-body.collapsed { max-height: 0; }

  /* 标签列表 */
  .label-list {
    padding: 6px 0;
  }

  .label-item {
    display: flex;
    align-items: center;
    padding: 7px 14px;
    gap: 10px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .label-item:hover { background: rgba(255,255,255,0.04); }
  .label-item.selected { background: rgba(233,69,96,0.12); }

  .label-color-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15);
  }

  .label-name {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
  }

  .label-shape-icon {
    font-size: 11px;
    color: var(--fg-muted);
    width: 18px;
    text-align: center;
  }

  .label-visibility {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-size: 12px;
    color: var(--fg-muted);
    transition: all 0.15s;
  }

  .label-visibility:hover { background: rgba(255,255,255,0.08); color: var(--fg); }
  .label-visibility.hidden { color: rgba(255,255,255,0.2); }

  /* 标注属性 */
  .annotation-props {
    padding: 12px 14px;
  }

  .prop-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }

  .prop-label {
    font-size: 12px;
    color: var(--fg-muted);
    width: 56px;
    flex-shrink: 0;
  }

  .prop-value {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--fg);
    flex: 1;
  }

  .prop-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .prop-input:focus { border-color: var(--accent); }

  /* 显示选项 */
  .display-options {
    padding: 10px 14px;
  }

  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
  }

  .option-label {
    font-size: 13px;
    color: var(--fg);
  }

  /* 自定义 toggle */
  .toggle {
    width: 36px;
    height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
  }

  .toggle.on { background: var(--accent); }

  .toggle::after {
    content: '';
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: transform 0.2s;
  }

  .toggle.on::after { transform: translateX(16px); }

  /* 标签显示模式选择 */
  .display-mode-group {
    display: flex;
    gap: 4px;
    padding: 8px 14px;
  }

  .mode-btn {
    flex: 1;
    padding: 6px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg-muted);
    font-size: 11px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .mode-btn:hover { border-color: var(--accent); color: var(--fg); }
  .mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .toast {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--fg);
    backdrop-filter: blur(12px);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  @keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  /* 快捷键帮助浮层 */
  .help-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .help-overlay.visible { display: flex; }

  .help-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .help-card h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--accent);
  }

  .shortcut-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
  }

  .shortcut-key {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    border: 1px solid var(--border);
  }

  .help-close {
    margin-top: 16px;
    text-align: center;
  }

  .help-close button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* 右键菜单 */
  .context-menu {
    position: fixed;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 0;
    min-width: 160px;
    z-index: 200;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .context-menu.visible { display: block; }

  .ctx-item {
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.1s;
  }

  .ctx-item:hover { background: rgba(233,69,96,0.15); }
  .ctx-item i { width: 16px; text-align: center; color: var(--fg-muted); font-size: 12px; }
  .ctx-separator { height: 1px; background: var(--border); margin: 4px 0; }

  /* 动画装饰 */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .recording-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
    display: inline-block;
  }
</style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="toolbar">
  <span class="toolbar-title"><i class="fa-solid fa-vector-square"></i> Labelme Viewer</span>

  <button class="toolbar-btn active" id="btnSelect" onclick="setTool('select')" title="选择工具">
    <i class="fa-solid fa-arrow-pointer"></i> 选择
  </button>
  <button class="toolbar-btn" id="btnPolygon" onclick="setTool('polygon')" title="多边形标注">
    <i class="fa-solid fa-draw-polygon"></i> 多边形
  </button>
  <button class="toolbar-btn" id="btnRectangle" onclick="setTool('rectangle')" title="矩形标注">
    <i class="fa-regular fa-square"></i> 矩形
  </button>
  <button class="toolbar-btn" id="btnCircle" onclick="setTool('circle')" title="圆形标注">
    <i class="fa-regular fa-circle"></i> 圆形
  </button>
  <button class="toolbar-btn" id="btnPoint" onclick="setTool('point')" title="点标注">
    <i class="fa-solid fa-location-dot"></i> 点
  </button>

  <div class="toolbar-separator"></div>

  <button class="toolbar-btn" onclick="undoLastPoint()" title="撤销上一个点">
    <i class="fa-solid fa-rotate-left"></i>
  </button>
  <button class="toolbar-btn" onclick="deleteSelected()" title="删除选中">
    <i class="fa-solid fa-trash"></i>
  </button>
  <button class="toolbar-btn" onclick="clearAll()" title="清除全部">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <div class="toolbar-separator"></div>

  <button class="toolbar-btn" onclick="toggleHelp()" title="快捷键帮助">
    <i class="fa-solid fa-keyboard"></i>
  </button>

  <div class="toolbar-slider-group">
    <label>填充透明度</label>
    <input type="range" id="opacitySlider" min="0" max="100" value="35" oninput="updateOpacity(this.value)">
    <span class="slider-val" id="opacityVal">35%</span>
  </div>

  <div class="toolbar-slider-group">
    <label>线宽</label>
    <input type="range" id="lineWidthSlider" min="1" max="6" value="2" oninput="updateLineWidth(this.value)">
    <span class="slider-val" id="lineWidthVal">2px</span>
  </div>
</div>

<!-- 主区域 -->
<div class="main-container">
  <!-- 画布区域 -->
  <div class="canvas-area" id="canvasArea">
    <canvas id="mainCanvas"></canvas>
    <div class="canvas-hint" id="canvasHint">
      <i class="fa-solid fa-circle-info"></i>
      <span id="hintText">选择工具后在图像上绘制标注，右键完成多边形</span>
    </div>
    <div class="zoom-indicator" id="zoomIndicator">100%</div>
  </div>

  <!-- 右侧面板 -->
  <div class="side-panel">
    <!-- 标签显示模式 -->
    <div class="panel-section">
      <div class="panel-section-header" onclick="toggleSection(this)">
        标签显示模式 <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="panel-section-body">
        <div class="display-mode-group">
          <button class="mode-btn active" data-mode="label" onclick="setDisplayMode('label', this)">标签名</button>
          <button class="mode-btn" data-mode="id" onclick="setDisplayMode('id', this)">编号</button>
          <button class="mode-btn" data-mode="both" onclick="setDisplayMode('both', this)">名称+编号</button>
          <button class="mode-btn" data-mode="none" onclick="setDisplayMode('none', this)">隐藏</button>
        </div>
      </div>
    </div>

    <!-- 显示选项 -->
    <div class="panel-section">
      <div class="panel-section-header" onclick="toggleSection(this)">
        显示选项 <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="panel-section-body">
        <div class="display-options">
          <div class="option-row">
            <span class="option-label">显示填充</span>
            <div class="toggle on" id="toggleFill" onclick="toggleOption(this, 'showFill')"></div>
          </div>
          <div class="option-row">
            <span class="option-label">显示边框</span>
            <div class="toggle on" id="toggleStroke" onclick="toggleOption(this, 'showStroke')"></div>
          </div>
          <div class="option-row">
            <span class="option-label">显示标签文字</span>
            <div class="toggle on" id="toggleText" onclick="toggleOption(this, 'showText')"></div>
          </div>
          <div class="option-row">
            <span class="option-label">显示控制点</span>
            <div class="toggle on" id="togglePoints" onclick="toggleOption(this, 'showPoints')"></div>
          </div>
          <div class="option-row">
            <span class="option-label">显示十字准线</span>
            <div class="toggle" id="toggleCrosshair" onclick="toggleOption(this, 'showCrosshair')"></div>
          </div>
          <div class="option-row">
            <span class="option-label">标签背景框</span>
            <div class="toggle on" id="toggleLabelBg" onclick="toggleOption(this, 'showLabelBg')"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 标注列表 -->
    <div class="panel-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="panel-section-header" onclick="toggleSection(this)">
        标注列表 <span id="annotCount" style="font-weight:400; font-size:11px; color:var(--fg-muted);">(0)</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="panel-section-body" style="flex:1; overflow-y:auto;">
        <div class="label-list" id="labelList">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>

    <!-- 选中标注属性 -->
    <div class="panel-section" id="propsSection" style="display:none;">
      <div class="panel-section-header" onclick="toggleSection(this)">
        属性 <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="panel-section-body">
        <div class="annotation-props" id="annotProps">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="contextMenu">
  <div class="ctx-item" onclick="finishPolygon()"><i class="fa-solid fa-check"></i> 完成多边形</div>
  <div class="ctx-item" onclick="undoLastPoint()"><i class="fa-solid fa-rotate-left"></i> 撤销上一个点</div>
  <div class="ctx-separator"></div>
  <div class="ctx-item" onclick="deleteSelected()"><i class="fa-solid fa-trash"></i> 删除选中</div>
  <div class="ctx-item" onclick="duplicateSelected()"><i class="fa-solid fa-copy"></i> 复制选中</div>
</div>

<!-- 帮助浮层 -->
<div class="help-overlay" id="helpOverlay" onclick="if(event.target===this)toggleHelp()">
  <div class="help-card">
    <h2>快捷键</h2>
    <div class="shortcut-row"><span>选择工具</span><span class="shortcut-key">V</span></div>
    <div class="shortcut-row"><span>多边形工具</span><span class="shortcut-key">P</span></div>
    <div class="shortcut-row"><span>矩形工具</span><span class="shortcut-key">R</span></div>
    <div class="shortcut-row"><span>圆形工具</span><span class="shortcut-key">C</span></div>
    <div class="shortcut-row"><span>点标注工具</span><span class="shortcut-key">D</span></div>
    <div class="shortcut-row"><span>撤销上一个点</span><span class="shortcut-key">Ctrl+Z</span></div>
    <div class="shortcut-row"><span>删除选中</span><span class="shortcut-key">Delete</span></div>
    <div class="shortcut-row"><span>完成多边形</span><span class="shortcut-key">右键 / Enter</span></div>
    <div class="shortcut-row"><span>取消绘制</span><span class="shortcut-key">Esc</span></div>
    <div class="shortcut-row"><span>缩放</span><span class="shortcut-key">滚轮</span></div>
    <div class="shortcut-row"><span>平移</span><span class="shortcut-key">中键拖拽</span></div>
    <div class="help-close"><button onclick="toggleHelp()">关闭</button></div>
  </div>
</div>

<!-- Toast容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================
// 全局状态
// ============================
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const canvasArea = document.getElementById('canvasArea');

// 标注颜色表（模仿 labelme 的颜色方案）
const COLORS = [
  '#e94560', '#00d2d3', '#54a0ff', '#feca57', '#1dd1a1',
  '#f368e0', '#ff9f43', '#6c5ce7', '#a29bfe', '#fd79a8',
  '#00cec9', '#e17055', '#0984e3', '#fdcb6e', '#e84393',
  '#55efc4', '#fab1a0', '#74b9ff', '#dfe6e9', '#636e72'
];

// 预置类别名
const LABEL_NAMES = [
  'car', 'person', 'building', 'tree', 'road',
  'sky', 'sign', 'dog', 'bicycle', 'window'
];

// 所有标注
let annotations = [];
let nextId = 1;

// 当前工具
let currentTool = 'select';

// 绘制中的临时状态
let drawingPoints = [];
let isDrawing = false;
let rectStart = null;
let circleStart = null;

// 选中标注
let selectedId = null;

// 拖拽
let isDragging = false;
let dragOffset = { x: 0, y: 0 };

// 画布变换
let scale = 1;
let offsetX = 0, offsetY = 0;
let isPanning = false;
let panStart = { x: 0, y: 0 };

// 鼠标位置
let mouseX = 0, mouseY = 0;

// 显示选项
let displayOptions = {
  showFill: true,
  showStroke: true,
  showText: true,
  showPoints: true,
  showCrosshair: false,
  showLabelBg: true,
  fillOpacity: 0.35,
  lineWidth: 2,
  displayMode: 'label' // label | id | both | none
};

// 示例图片
let sampleImage = null;

// ============================
// 初始化
// ============================
function init() {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // 加载示例图片
  sampleImage = new Image();
  sampleImage.crossOrigin = 'anonymous';
  sampleImage.src = 'https://picsum.photos/seed/labelme-demo/800/600.jpg';
  sampleImage.onload = () => {
    // 加载完成后添加一些示例标注
    addSampleAnnotations();
    render();
  };
  sampleImage.onerror = () => {
    // 图片加载失败也添加示例标注
    addSampleAnnotations();
    render();
  };

  // 画布事件
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('wheel', onWheel);
  canvas.addEventListener('contextmenu', onContextMenu);
  canvas.addEventListener('dblclick', onDblClick);

  // 全局事件
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('click', () => {
    document.getElementById('contextMenu').classList.remove('visible');
  });

  render();
}

function resizeCanvas() {
  const rect = canvasArea.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  render();
}

// ============================
// 示例标注数据

// ============================
// 坐标转换
// ============================
function screenToWorld(sx, sy) {
  return {
    x: (sx - offsetX) / scale,
    y: (sy - offsetY) / scale
  };
}

function worldToScreen(wx, wy) {
  return {
    x: wx * scale + offsetX,
    y: wy * scale + offsetY
  };
}

// ============================
// 渲染
// ============================
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 绘制棋盘格背景（无图片时的底图）
  drawCheckerboard();

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // 绘制示例图片
  if (sampleImage && sampleImage.complete && sampleImage.naturalWidth > 0) {
    ctx.drawImage(sampleImage, 0, 0);
  }

  // 绘制所有标注
  annotations.forEach(ann => {
    if (!ann.visible) return;
    drawAnnotation(ann);
  });

  // 绘制正在绘制的临时标注
  drawTempAnnotation();

  ctx.restore();

  // 十字准线（屏幕空间）
  if (displayOptions.showCrosshair) {
    drawCrosshair();
  }
}

function drawCheckerboard() {
  const size = 16;
  const cols = Math.ceil(canvas.width / size);
  const rows = Math.ceil(canvas.height / size);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#2a2a3e' : '#252538';
      ctx.fillRect(c * size, r * size, size, size);
    }
  }
}

function drawAnnotation(ann) {
  const isSelected = ann.id === selectedId;
  const color = ann.color;
  const opacity = displayOptions.fillOpacity;

  if (ann.type === 'polygon') {
    drawPolygon(ann, color, opacity, isSelected);
  } else if (ann.type === 'rectangle') {
    drawRectangle(ann, color, opacity, isSelected);
  } else if (ann.type === 'circle') {
    drawCircle(ann, color, opacity, isSelected);
  } else if (ann.type === 'point') {
    drawPoint(ann, color, isSelected);
  }
}

function drawPolygon(ann, color, opacity, isSelected) {
  const pts = ann.points;
  if (pts.length < 2) return;

  // 填充
  if (displayOptions.showFill) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = hexToRgba(color, opacity);
    ctx.fill();
  }

  // 边框
  if (displayOptions.showStroke) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.closePath();
    ctx.strokeStyle = color;
    ctx.lineWidth = displayOptions.lineWidth / scale;
    ctx.stroke();

    // 选中高亮
    if (isSelected) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = (displayOptions.lineWidth + 1) / scale;
      ctx.setLineDash([6 / scale, 4 / scale]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 控制点
  if (displayOptions.showPoints) {
    const ptSize = Math.max(3, 4 / scale);
    pts.forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, ptSize, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#ffffff' : color;
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1 / scale;
      ctx.stroke();
    });
  }

  // 标签文字
  if (displayOptions.showText) {
    const centroid = getPolygonCentroid(pts);
    drawLabel(ann, centroid.x, centroid.y - 8 / scale);
  }
}

function drawRectangle(ann, color, opacity, isSelected) {
  const [p1, p2] = ann.points;
  if (!p1 || !p2) return;
  const x = Math.min(p1.x, p2.x);
  const y = Math.min(p1.y, p2.y);
  const w = Math.abs(p2.x - p1.x);
  const h = Math.abs(p2.y - p1.y);

  if (displayOptions.showFill) {
    ctx.fillStyle = hexToRgba(color, opacity);
    ctx.fillRect(x, y, w, h);
  }

  if (displayOptions.showStroke) {
    ctx.strokeStyle = color;
    ctx.lineWidth = displayOptions.lineWidth / scale;
    ctx.strokeRect(x, y, w, h);

    if (isSelected) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = (displayOptions.lineWidth + 1) / scale;
      ctx.setLineDash([6 / scale, 4 / scale]);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
    }
  }

  // 矩形四个角控制点
  if (displayOptions.showPoints) {
    const corners = [
      { x: x, y: y }, { x: x + w, y: y },
      { x: x + w, y: y + h }, { x: x, y: y + h }
    ];
    const ptSize = Math.max(3, 4 / scale);
    corners.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, ptSize, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#ffffff' : color;
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1 / scale;
      ctx.stroke();
    });
  }

  if (displayOptions.showText) {
    drawLabel(ann, x + w / 2, y - 8 / scale);
  }
}

function drawCircle(ann, color, opacity, isSelected) {
  if (!ann.center || !ann.radius) return;
  const r = Math.max(1, ann.radius);

  if (displayOptions.showFill) {
    ctx.beginPath();
    ctx.arc(ann.center.x, ann.center.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(color, opacity);
    ctx.fill();
  }

  if (displayOptions.showStroke) {
    ctx.beginPath();
    ctx.arc(ann.center.x, ann.center.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = displayOptions.lineWidth / scale;
    ctx.stroke();

    if (isSelected) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = (displayOptions.lineWidth + 1) / scale;
      ctx.setLineDash([6 / scale, 4 / scale]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 圆心控制点
  if (displayOptions.showPoints) {
    const ptSize = Math.max(3, 4 / scale);
    ctx.beginPath();
    ctx.arc(ann.center.x, ann.center.y, ptSize, 0, Math.PI * 2);
    ctx.fillStyle = isSelected ? '#ffffff' : color;
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1 / scale;
    ctx.stroke();
  }

  if (displayOptions.showText) {
    drawLabel(ann, ann.center.x, ann.center.y - r - 10 / scale);
  }
}

function drawPoint(ann, color, isSelected) {
  if (!ann.center) return;
  const ptSize = Math.max(5, 7 / scale);

  // 外圈
  ctx.beginPath();
  ctx.arc(ann.center.x, ann.center.y, ptSize + 2 / scale, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(color, 0.3);
  ctx.fill();

  // 内圈
  ctx.beginPath();
  ctx.arc(ann.center.x, ann.center.y, ptSize, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  if (isSelected) {
    ctx.beginPath();
    ctx.arc(ann.center.x, ann.center.y, ptSize + 4 / scale, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 / scale;
    ctx.setLineDash([4 / scale, 3 / scale]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (displayOptions.showText) {
    drawLabel(ann, ann.center.x, ann.center.y - ptSize - 10 / scale);
  }
}

function drawLabel(ann, x, y) {
  const mode = displayOptions.displayMode;
  let text = '';
  if (mode === 'label') text = ann.label;
  else if (mode === 'id') text = String(ann.id);
  else if (mode === 'both') text = `${ann.label} #${ann.id}`;
  else if (mode === 'none') return;

  const fontSize = Math.max(11, 13 / scale);
  ctx.font = `600 ${fontSize}px 'Noto Sans SC', sans-serif`;
  const metrics = ctx.measureText(text);
  const tw = metrics.width;
  const th = fontSize;
  const pad = 4 / scale;

  // 标签位置微调：确保在视口内
  const screenPos = worldToScreen(x, y);
  // 不做复杂判断，简单偏移

  if (displayOptions.showLabelBg) {
    ctx.fillStyle = hexToRgba(ann.color, 0.85);
    const radius = 3 / scale;
    const bx = x - tw / 2 - pad;
    const by = y - th / 2 - pad / 2;
    const bw = tw + pad * 2;
    const bh = th + pad;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, radius);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function drawTempAnnotation() {
  if (!isDrawing) return;

  const color = '#ffffff';

  if (currentTool === 'polygon' && drawingPoints.length > 0) {
    const worldMouse = screenToWorld(mouseX, mouseY);

    // 绘制已有的线段
    ctx.beginPath();
    ctx.moveTo(drawingPoints[0].x, drawingPoints[0].y);
    for (let i = 1; i < drawingPoints.length; i++) {
      ctx.lineTo(drawingPoints[i].x, drawingPoints[i].y);
    }
    ctx.lineTo(worldMouse.x, worldMouse.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 / scale;
    ctx.setLineDash([6 / scale, 4 / scale]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 闭合预览线
    if (drawingPoints.length > 1) {
      ctx.beginPath();
      ctx.moveTo(worldMouse.x, worldMouse.y);
      ctx.lineTo(drawingPoints[0].x, drawingPoints[0].y);
      ctx.strokeStyle = hexToRgba('#ffffff', 0.3);
      ctx.lineWidth = 1 / scale;
      ctx.setLineDash([4 / scale, 4 / scale]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 控制点
    const ptSize = Math.max(3, 4 / scale);
    drawingPoints.forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, ptSize, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? '#00d2d3' : '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1 / scale;
      ctx.stroke();
    });

    // 起始点吸附提示
    if (drawingPoints.length > 2) {
      const dist = Math.hypot(worldMouse.x - drawingPoints[0].x, worldMouse.y - drawingPoints[0].y);
      if (dist < 15 / scale) {
        ctx.beginPath();
        ctx.arc(drawingPoints[0].x, drawingPoints[0].y, 8 / scale, 0, Math.PI * 2);
        ctx.strokeStyle = '#00d2d3';
        ctx.lineWidth = 2 / scale;
        ctx.stroke();
      }
    }
  }

  if (currentTool === 'rectangle' && rectStart) {
    const worldMouse = screenToWorld(mouseX, mouseY);
    const x = Math.min(rectStart.x, worldMouse.x);
    const y = Math.min(rectStart.y, worldMouse.y);
    const w = Math.abs(worldMouse.x - rectStart.x);
    const h = Math.abs(worldMouse.y - rectStart.y);

    ctx.strokeStyle = color;
    ctx.lineWidth = 2 / scale;
    ctx.setLineDash([6 / scale, 4 / scale]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);

    ctx.fillStyle = hexToRgba('#ffffff', 0.1);
    ctx.fillRect(x, y, w, h);
  }

  if (currentTool === 'circle' && circleStart) {
    const worldMouse = screenToWorld(mouseX, mouseY);
    const r = Math.max(1, Math.hypot(worldMouse.x - circleStart.x, worldMouse.y - circleStart.y));

    ctx.beginPath();
    ctx.arc(circleStart.x, circleStart.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 / scale;
    ctx.setLineDash([6 / scale, 4 / scale]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = hexToRgba('#ffffff', 0.1);
    ctx.fill();
  }
}

function drawCrosshair() {
  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(mouseX, 0);
  ctx.lineTo(mouseX, canvas.height);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, mouseY);
  ctx.lineTo(canvas.width, mouseY);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.restore();
}

// ============================
// 交互事件
// ============================
function onMouseDown(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);

  // 中键平移
  if (e.button === 1) {
    isPanning = true;
    panStart = { x: e.clientX - offsetX, y: e.clientY - offsetY };
    canvas.style.cursor = 'grab';
    e.preventDefault();
    return;
  }

  // 右键处理
  if (e.button === 2) {
    if (isDrawing && currentTool === 'polygon') {
      finishPolygon();
    }
    return;
  }

  // 左键
  if (currentTool === 'select') {
    // 尝试选中标注
    const hit = hitTest(world);
    if (hit) {
      selectedId = hit.id;
      isDragging = true;
      dragOffset = { x: world.x, y: world.y };
      canvas.style.cursor = 'move';
    } else {
      selectedId = null;
    }
    updateLabelList();
    updateProps();
    render();
  } else if (currentTool === 'polygon') {
    if (!isDrawing) {
      isDrawing = true;
      drawingPoints = [{ x: world.x, y: world.y }];
    } else {
      // 检查是否点击了起始点（闭合）
      if (drawingPoints.length > 2) {
        const dist = Math.hypot(world.x - drawingPoints[0].x, world.y - drawingPoints[0].y);
        if (dist < 15 / scale) {
          finishPolygon();
          return;
        }
      }
      drawingPoints.push({ x: world.x, y: world.y });
    }
    render();
  } else if (currentTool === 'rectangle') {
    isDrawing = true;
    rectStart = { x: world.x, y: world.y };
  } else if (currentTool === 'circle') {
    isDrawing = true;
    circleStart = { x: world.x, y: world.y };
  } else if (currentTool === 'point') {
    // 直接创建点标注
    const label = LABEL_NAMES[annotations.length % LABEL_NAMES.length];
    const color = COLORS[annotations.length % COLORS.length];
    annotations.push({
      id: nextId++,
      type: 'point',
      label: label,
      color: color,
      visible: true,
      center: { x: world.x, y: world.y },
      points: []
    });
    selectedId = annotations[annotations.length - 1].id;
    updateLabelList();
    updateProps();
    render();
    showToast('已添加点标注');
  }
}

function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;

  if (isPanning) {
    offsetX = e.clientX - panStart.x;
    offsetY = e.clientY - panStart.y;
    render();
    return;
  }

  if (isDragging && selectedId !== null) {
    const world = screenToWorld(mouseX, mouseY);
    const ann = annotations.find(a => a.id === selectedId);
    if (ann) {
      const dx = world.x - dragOffset.x;
      const dy = world.y - dragOffset.y;
      moveAnnotation(ann, dx, dy);
      dragOffset = { x: world.x, y: world.y };
    }
    render();
    return;
  }

  if (isDrawing) {
    render();
    return;
  }

  // 十字准线需要持续渲染
  if (displayOptions.showCrosshair) {
    render();
  }

  // 更新光标
  if (currentTool === 'select') {
    const world = screenToWorld(mouseX, mouseY);
    const hit = hitTest(world);
    canvas.style.cursor = hit ? 'pointer' : 'default';
  }
}

function onMouseUp(e) {
  if (isPanning) {
    isPanning = false;
    canvas.style.cursor = currentTool === 'select' ? 'default' : 'crosshair';
    return;
  }

  if (isDragging) {
    isDragging = false;
    canvas.style.cursor = 'pointer';
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);

  if (currentTool === 'rectangle' && isDrawing && rectStart) {
    const w = Math.abs(world.x - rectStart.x);
    const h = Math.abs(world.y - rectStart.y);
    if (w > 5 / scale && h > 5 / scale) {
      const label = LABEL_NAMES[annotations.length % LABEL_NAMES.length];
      const color = COLORS[annotations.length % COLORS.length];
      annotations.push({
        id: nextId++,
        type: 'rectangle',
        label: label,
        color: color,
        visible: true,
        points: [
          { x: Math.min(rectStart.x, world.x), y: Math.min(rectStart.y, world.y) },
          { x: Math.max(rectStart.x, world.x), y: Math.max(rectStart.y, world.y) }
        ]
      });
      selectedId = annotations[annotations.length - 1].id;
      updateLabelList();
      updateProps();
      showToast('已添加矩形标注');
    }
    isDrawing = false;
    rectStart = null;
    render();
  }

  if (currentTool === 'circle' && isDrawing && circleStart) {
    const r = Math.hypot(world.x - circleStart.x, world.y - circleStart.y);
    if (r > 5 / scale) {
      const label = LABEL_NAMES[annotations.length % LABEL_NAMES.length];
      const color = COLORS[annotations.length % COLORS.length];
      annotations.push({
        id: nextId++,
        type: 'circle',
        label: label,
        color: color,
        visible: true,
        center: { x: circleStart.x, y: circleStart.y },
        radius: r,
        points: []
      });
      selectedId = annotations[annotations.length - 1].id;
      updateLabelList();
      updateProps();
      showToast('已添加圆形标注');
    }
    isDrawing = false;
    circleStart = null;
    render();
  }
}

function onWheel(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const oldScale = scale;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(10, Math.max(0.1, scale * delta));

  // 以鼠标位置为中心缩放
  offsetX = mx - (mx - offsetX) * (scale / oldScale);
  offsetY = my - (my - offsetY) * (scale / oldScale);

  document.getElementById('zoomIndicator').textContent = Math.round(scale * 100) + '%';
  render();
}

function onContextMenu(e) {
  e.preventDefault();

  if (isDrawing && currentTool === 'polygon') {
    const menu = document.getElementById('contextMenu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('visible');
  }
}

function onDblClick(e) {
  if (isDrawing && currentTool === 'polygon' && drawingPoints.length > 2) {
    // 移除双击多添加的最后一个点
    drawingPoints.pop();
    finishPolygon();
  }
}

function onKeyDown(e) {
  // 工具切换
  if (e.key === 'v' || e.key === 'V') setTool('select');
  if (e.key === 'p' || e.key === 'P') setTool('polygon');
  if (e.key === 'r' || e.key === 'R') setTool('rectangle');
  if (e.key === 'c' || e.key === 'C') setTool('circle');
  if (e.key === 'd' || e.key === 'D') setTool('point');

  // 撤销
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    undoLastPoint();
  }

  // 删除
  if (e.key === 'Delete' || e.key === 'Backspace') {
    deleteSelected();
  }

  // 完成
  if (e.key === 'Enter' && isDrawing && currentTool === 'polygon') {
    finishPolygon();
  }

  // 取消
  if (e.key === 'Escape') {
    if (isDrawing) {
      cancelDrawing();
    } else {
      selectedId = null;
      updateLabelList();
      updateProps();
      render();
    }
  }
}

// ============================
// 工具和操作
// ============================
function setTool(tool) {
  // 取消当前绘制
  if (isDrawing) cancelDrawing();

  currentTool = tool;
  canvas.style.cursor = tool === 'select' ? 'default' : 'crosshair';

  // 更新按钮状态
  document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
  const btnId = 'btn' + tool.charAt(0).toUpperCase() + tool.slice(1);
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.add('active');

  // 更新提示
  const hints = {
    select: '点击标注进行选择，拖拽移动',
    polygon: '左键添加顶点，右键或双击完成多边形',
    rectangle: '左键拖拽绘制矩形',
    circle: '左键拖拽绘制圆形（从圆心到边缘）',
    point: '左键点击添加点标注'
  };
  document.getElementById('hintText').textContent = hints[tool] || '';
}

function finishPolygon() {
  if (drawingPoints.length < 3) {
    showToast('多边形至少需要3个顶点');
    cancelDrawing();
    return;
  }

  const label = LABEL_NAMES[annotations.length % LABEL_NAMES.length];
  const color = COLORS[annotations.length % COLORS.length];
  annotations.push({
    id: nextId++,
    type: 'polygon',
    label: label,
    color: color,
    visible: true,
    points: [...drawingPoints]
  });
  selectedId = annotations[annotations.length - 1].id;

  drawingPoints = [];
  isDrawing = false;
  updateLabelList();
  updateProps();
  render();
  showToast('已添加多边形标注');
  document.getElementById('contextMenu').classList.remove('visible');
}

function cancelDrawing() {
  drawingPoints = [];
  isDrawing = false;
  rectStart = null;
  circleStart = null;
  render();
}

function undoLastPoint() {
  if (isDrawing && currentTool === 'polygon' && drawingPoints.length > 0) {
    drawingPoints.pop();
    if (drawingPoints.length === 0) isDrawing = false;
    render();
  }
  document.getElementById('contextMenu').classList.remove('visible');
}

function deleteSelected() {
  if (selectedId === null) return;
  annotations = annotations.filter(a => a.id !== selectedId);
  selectedId = null;
  updateLabelList();
  updateProps();
  render();
  showToast('已删除标注');
  document.getElementById('contextMenu').classList.remove('visible');
}

function duplicateSelected() {
  const ann = annotations.find(a => a.id === selectedId);
  if (!ann) return;

  const newAnn = JSON.parse(JSON.stringify(ann));
  newAnn.id = nextId++;
  newAnn.label = ann.label;

  // 偏移一点
  const offset = 20;
  if (newAnn.points) {
    newAnn.points = newAnn.points.map(p => ({ x: p.x + offset, y: p.y + offset }));
  }
  if (newAnn.center) {
    newAnn.center = { x: newAnn.center.x + offset, y: newAnn.center.y + offset };
  }

  annotations.push(newAnn);
  selectedId = newAnn.id;
  updateLabelList();
  updateProps();
  render();
  showToast('已复制标注');
  document.getElementById('contextMenu').classList.remove('visible');
}

function clearAll() {
  if (annotations.length === 0) return;
  annotations = [];
  selectedId = null;
  nextId = 1;
  cancelDrawing();
  updateLabelList();
  updateProps();
  render();
  showToast('已清除所有标注');
}

function moveAnnotation(ann, dx, dy) {
  if (ann.points) {
    ann.points.forEach(p => { p.x += dx; p.y += dy; });
  }
  if (ann.center) {
    ann.center.x += dx;
    ann.center.y += dy;
  }
}

// ============================
// 碰撞检测
// ============================
function hitTest(world) {
  // 从后往前遍历（后绘制的在上层）
  for (let i = annotations.length - 1; i >= 0; i--) {
    const ann = annotations[i];
    if (!ann.visible) continue;

    if (ann.type === 'polygon' && isPointInPolygon(world, ann.points)) return ann;
    if (ann.type === 'rectangle' && isPointInRect(world, ann.points)) return ann;
    if (ann.type === 'circle' && ann.center && ann.radius) {
      const dist = Math.hypot(world.x - ann.center.x, world.y - ann.center.y);
      if (dist <= ann.radius) return ann;
    }
    if (ann.type === 'point' && ann.center) {
      const dist = Math.hypot(world.x - ann.center.x, world.y - ann.center.y);
      if (dist <= 12 / scale) return ann;
    }
  }
  return null;
}

function isPointInPolygon(p, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].x, yi = pts[i].y;
    const xj = pts[j].x, yj = pts[j].y;
    const intersect = ((yi > p.y) !== (yj > p.y)) &&
      (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function isPointInRect(p, pts) {
  if (!pts[0] || !pts[1]) return false;
  const minX = Math.min(pts[0].x, pts[1].x);
  const maxX = Math.max(pts[0].x, pts[1].x);
  const minY = Math.min(pts[0].y, pts[1].y);
  const maxY = Math.max(pts[0].y, pts[1].y);
  return p.x >= minX && p.x <= maxX && p.y >= minY && p.y <= maxY;
}

// ============================
// UI 更新
// ============================
function updateLabelList() {
  const list = document.getElementById('labelList');
  const count = document.getElementById('annotCount');
  count.textContent = `(${annotations.length})`;

  list.innerHTML = annotations.map(ann => {
    const isSelected = ann.id === selectedId;
    const iconMap = {
      polygon: 'fa-draw-polygon',
      rectangle: 'fa-square',
      circle: 'fa-circle',
      point: 'fa-location-dot'
    };
    return `
      <div class="label-item ${isSelected ? 'selected' : ''}" onclick="selectAnnotation(${ann.id})" data-id="${ann.id}">
        <div class="label-color-dot" style="background:${ann.color}"></div>
        <span class="label-name">${ann.label}</span>
        <span class="label-shape-icon"><i class="fa-solid ${iconMap[ann.type] || 'fa-shapes'}"></i></span>
        <div class="label-visibility ${ann.visible ? '' : 'hidden'}" onclick="event.stopPropagation(); toggleVisibility(${ann.id})">
          <i class="fa-solid ${ann.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
        </div>
      </div>
    `;
  }).join('');
}

function updateProps() {
  const section = document.getElementById('propsSection');
  const props = document.getElementById('annotProps');

  if (selectedId === null) {
    section.style.display = 'none';
    return;
  }

  const ann = annotations.find(a => a.id === selectedId);
  if (!ann) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';

  const typeNames = { polygon: '多边形', rectangle: '矩形', circle: '圆形', point: '点' };

  props.innerHTML = `
    <div class="prop-row">
      <span class="prop-label">ID</span>
      <span class="prop-value">#${ann.id}</span>
    </div>
    <div class="prop-row">
      <span class="prop-label">类型</span>
      <span class="prop-value">${typeNames[ann.type] || ann.type}</span>
    </div>
    <div class="prop-row">
      <span class="prop-label">标签</span>
      <input class="prop-input" value="${ann.label}" onchange="updateAnnotLabel(${ann.id}, this.value)">
    </div>
    <div class="prop-row">
      <span class="prop-label">颜色</span>
      <span class="prop-value" style="color:${ann.color}">${ann.color}</span>
    </div>
    ${ann.points ? `<div class="prop-row"><span class="prop-label">顶点数</span><span class="prop-value">${ann.points.length}</span></div>` : ''}
    ${ann.radius ? `<div class="prop-row"><span class="prop-label">半径</span><span class="prop-value">${ann.radius.toFixed(1)}</span></div>` : ''}
  `;
}

function selectAnnotation(id) {
  selectedId = id;
  updateLabelList();
  updateProps();
  render();
}

function toggleVisibility(id) {
  const ann = annotations.find(a => a.id === id);
  if (ann) {
    ann.visible = !ann.visible;
    updateLabelList();
    render();
  }
}

function updateAnnotLabel(id, newLabel) {
  const ann = annotations.find(a => a.id === id);
  if (ann) {
    ann.label = newLabel;
    updateLabelList();
    render();
  }
}

// ============================
// 显示选项
// ============================
function toggleOption(el, key) {
  el.classList.toggle('on');
  displayOptions[key] = el.classList.contains('on');
  render();
}

function setDisplayMode(mode, btn) {
  displayOptions.displayMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function updateOpacity(val) {
  displayOptions.fillOpacity = val / 100;
  document.getElementById('opacityVal').textContent = val + '%';
  render();
}

function updateLineWidth(val) {
  displayOptions.lineWidth = parseInt(val);
  document.getElementById('lineWidthVal').textContent = val + 'px';
  render();
}

function toggleSection(header) {
  header.classList.toggle('collapsed');
  const body = header.nextElementSibling;
  body.classList.toggle('collapsed');
}

function toggleHelp() {
  document.getElementById('helpOverlay').classList.toggle('visible');
}

// ============================
// 工具函数
// ============================
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function getPolygonCentroid(pts) {
  let cx = 0, cy = 0;
  pts.forEach(p => { cx += p.x; cy += p.y; });
  return { x: cx / pts.length, y: cy / pts.length };
}

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ============================
// 启动
// ============================
init();
</script>
